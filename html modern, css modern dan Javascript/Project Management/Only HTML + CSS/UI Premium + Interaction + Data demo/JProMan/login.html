<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JProMan — Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/JProMan.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
<input type="checkbox" id="theme-toggle" class="theme-input">

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-logo">JP</span>
      <span class="brand-name">JProMan<small>Project Suite</small></span>
    </div>

    <h1>Masuk ke akunmu</h1>
    <p class="sub">Kelola project & tim dalam satu tempat.</p>

    <form class="form-grid" action="JProMan.html">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="andi@jproman.io" value="andi@jproman.io" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" value="demo1234" required>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;font-size:.82rem">
        <label style="display:flex;align-items:center;gap:8px;color:var(--text-muted)">
          <input type="checkbox" checked style="accent-color:var(--brand-500)"> Ingat saya
        </label>
        <a href="#">Lupa password?</a>
      </div>

      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
        Masuk ke Dashboard
      </button>
    </form>

    <p class="auth-alt">
      Belum punya akun? <a href="#">Daftar gratis</a>
    </p>

    <div style="margin-top:22px;display:flex;justify-content:center">
      <label for="theme-toggle" class="theme-toggle-label">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span style="font-size:.8rem;color:var(--text-muted)">Ganti tema</span>
      </label>
    </div>

    <p style="text-align:center;font-size:.72rem;color:var(--text-faint);margin-top:16px">
      Demo — kredensial sudah terisi otomatis.
    </p>
  </div>
</div>
</body>
</html>
